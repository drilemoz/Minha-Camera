name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar os APKs verificados em GitHub Releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Não presumir que sdkmanager esteja no PATH do runner (build #8, exit 127).
      # Esta ação instala as ferramentas de linha de comando, configura o SDK/PATH
      # e aceita as licenças antes de chamar sdkmanager.
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar Android SDK 36 e Build Tools
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # O cache inclui dependências e o cache local de tarefas do Gradle.

      - name: Verificar versionamento e compatibilidade do build
        run: |
          python3 scripts/check_version.py
          python3 -m unittest discover -s tests -p test_github_updater_1481.py -q
          python3 -m unittest discover -s tests -p test_rtsp_form_1480.py -q
          python3 -m unittest discover -s tests -p test_gradle_registration_1476.py -q
          python3 -m unittest discover -s tests -p test_release_and_version_1471.py -q
          python3 -m unittest discover -s tests -p test_viewer_toolbar_recovery_1472.py -q
          python3 -m unittest discover -s tests -p test_investigation_transfer_1473.py -q
          python3 scripts/check_android_resources.py
          python3 scripts/check_viewer_bindings.py
          python3 scripts/check_transmitter_bindings.py
          python3 -m unittest discover -s tests -p test_viewer_build_fix_1456.py -q
          python3 -m unittest discover -s tests -p test_android_resources.py -q
          python3 scripts/check_build_config.py
          python3 scripts/check_protocol_sources.py
          python3 scripts/check_kotlin_imports.py
          python3 -m unittest discover -s tests -p test_player_pixelcopy_1479.py -q
          python3 scripts/check_kotlin_gravity_import.py
          python3 scripts/check_kotlin_strings.py
          python3 scripts/check_kotlin_argb_literals.py
          python3 scripts/check_kotlin_view_minimum_size.py
          python3 scripts/check_kotlin_scroll_fill_viewport.py
          python3 -m unittest discover -s tests -p test_background_handoff_1468.py -q
          python3 -m unittest discover -s tests -p test_gallery_build_fix_1467.py -q
          python3 -m unittest discover -s tests -p test_gallery_build_fix_1465.py -q
          python3 -m unittest discover -s tests -p test_kotlin_strings_preflight.py -q
          python3 -m unittest discover -s tests -p test_import_preflight_1437.py -q
          python3 tests/test_qr_integration.py
          python3 -m unittest discover -s tests -p test_signing_preflight.py -q

      - name: Preparar assinatura Release permanente
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.KEYSTORE_HEX }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # KEYSTORE_HEX tem precedência sobre o Base64 legado (que pode estar corrompido).
          # Falha se o Secret novo foi truncado ou o certificado mudou.
          # A senha nunca aparece na linha de comando, nos logs ou no repositório.
          python3 scripts/prepare_signing.py

      # Compilação de código/recursos compartilhada: não usar matrix por ABI.
      - name: Testar protocolos e compilar todos os APKs release
        shell: bash
        env:
          MINHACAMERA_KEYSTORE_PATH: ${{ runner.temp }}/minha-camera-release.p12
          MINHACAMERA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MINHACAMERA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MINHACAMERA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SECONDS=0
          gradle testProtocol testReleaseUnitTest assembleRelease --no-daemon --build-cache --console=plain --stacktrace
          echo "Tempo do Gradle (testes e todos os APKs): ${SECONDS}s"

      - name: Verificar e nomear APKs; medir tamanhos
        id: apk
        run: python3 scripts/verify_apks.py

      - name: Publicar APK universal
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.universal }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.armeabi-v7a }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.arm64-v8a }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK x86_64
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.x86_64 }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK x86
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.x86 }}
          archive: false
          if-no-files-found: error

      - name: Publicar relatório e hashes
        uses: actions/upload-artifact@v7
        with:
          name: MinhaCamera-APK-verificacao
          path: |
            dist/apk-report.md
            dist/apk-report.json
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Preparar lote verificado para GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' && github.repository == 'drilemoz/Minha-Camera'
        uses: actions/upload-artifact@v7
        with:
          name: release-verificado
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/apk-report.json
          if-no-files-found: error

      - name: Limpar chave privada do runner
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/minha-camera-release.p12" "${RUNNER_TEMP}/minha-camera-cert.der"


  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' && github.repository == 'drilemoz/Minha-Camera'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: minha-camera-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-verificado
          path: release
      - name: Publicar apenas uma versão nova e verificada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_github_release.py release
          (cd release && sha256sum --check SHA256SUMS)
          version=$(jq -r '.identity[2]' release/apk-report.json)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag já existe. Não sobrescrevemos APKs publicados."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag já existe. Confira a revisão antes de publicar."
            exit 1
          else
            rc=$?
            test "$rc" -eq 2
          fi
          gh release create "$tag" release/*.apk release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Minha Câmera $version" --notes-file release/notes.md
